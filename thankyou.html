<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richiesta Inviata - Fid.ai</title>
    <!-- Riusiamo alcuni stili base se vuoi, o metti tutto inline -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #1d1d1f;
        }
        .container {
            max-width: 600px;
            padding: 3rem;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }
        h1 { font-weight: 600; margin-bottom: 1rem; }
        p { color: #6e6e73; margin-bottom: 2rem; font-size: 1.1rem; }
        .btn-primary {
            background-color: #007AFF;
            border-color: #007AFF;
            font-weight: 500;
            padding: 0.7rem 1.5rem;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            display: inline-block;
        }
         .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grazie!</h1>
        <p>La tua richiesta è stata inviata con successo. Ti contatteremo il prima possibile all'indirizzo email che hai fornito.</p>
        <a href="index.html" class="btn btn-primary">Torna alla homepage</a>
    </div>
</body>
</html>
